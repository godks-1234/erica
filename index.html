<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Mate</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; color: #333333; overflow: hidden; }
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0052D4, #4364F7); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s ease; }
        .splash-title { color: #ffffff; font-size: 3rem; font-weight: 800; font-style: italic; }
        #main-app { display: none; width: 100%; height: 100%; flex-direction: column; background-color: #f4f7f6; opacity: 0; transition: opacity 0.5s ease; }
        .dashboard-header { background: linear-gradient(90deg, #0052D4, #4364F7); color: white; padding: 15px 20px; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.8rem; opacity: 0.8; }
        .stat-value { font-size: 1.6rem; font-weight: 700; }
        .content-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

        .weather-widget-card { display: none; background: linear-gradient(145deg, #514A7F, #3B3466); color: #ffffff; padding: 20px; border-radius: 16px; }
        .weather-main-row { display: flex; justify-content: space-between; }
        .weather-temp-box .temp-num { font-size: 3.5rem; font-weight: 800; }
        .weather-detail-grid { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.15); display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; }
        .wd-label { font-size: 0.7rem; opacity: 0.7; }
        .wd-val { font-size: 0.85rem; font-weight: 700; }

        .score-card { display: none; background: #ffffff; border-radius: 16px; padding: 20px; border-left: 5px solid #ff9500; align-items: center; gap: 20px; }
        .score-circle-container { width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 4px solid #ff9500; font-size: 1.8rem; font-weight: 800; color: #ff9500; }

        .input-card { background: white; border-radius: 16px; padding: 20px; border-left: 5px solid #0052D4; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #0052D4; margin-bottom: 15px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.8rem; font-weight: 600; color: #666; }
        .input-group input, .input-group select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        
        .btn-submit { width: 100%; background: linear-gradient(90deg, #4364F7, #0052D4); color: white; border: none; padding: 12px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .location-badge { display: inline-block; background-color: #e6efff; color: #0052D4; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-top: 5px; }

        .output-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 15px; }
        .map-card { grid-column: span 2; background: white; border-radius: 16px; padding: 15px; }
        #map { width: 100%; height: 320px; border-radius: 12px; border: 1px solid #ddd; z-index: 1; }
        .output-panel { background: white; border-radius: 16px; padding: 18px; overflow-y: auto; max-height: 400px; }
        
        .timeline { position: relative; padding-left: 20px; border-left: 2px solid #e6efff; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item::before { content: ''; position: absolute; left: -26px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background-color: #4364F7; border: 2px solid white; }
        .timeline-item.alert::before { background-color: #ff3b30; }
        .timeline-alert-text { font-size: 0.8rem; color: #ff3b30; background-color: #ffebe9; padding: 6px 10px; border-radius: 6px; margin-top: 5px; border-left: 3px solid #ff3b30; }
        .description-text { font-size: 0.95rem; line-height: 1.6; white-space: pre-line; }
        .loader { display: none; text-align: center; padding: 30px; color: #4364F7; font-weight: 600; }
    </style>
</head>
<body>

    <div id="splash-screen"><div class="splash-title">Running Mate</div></div>

    <div id="main-app">
        <div class="dashboard-header">
            <div class="stat-box"><div class="stat-label">추천 시간</div><div class="stat-value" id="running-time">00:00</div></div>
            <div class="stat-box"><div class="stat-label">목표 거리</div><div class="stat-value" id="running-distance">-- km</div></div>
        </div>

        <div class="content-container">
            <!-- 날씨 카드 -->
            <div class="weather-widget-card" id="weather-widget">
                <div class="weather-main-row">
                    <div class="weather-temp-box">
                        <div class="temp-num" id="w-temp">--°</div>
                        <div class="weather-status" id="w-status">맑음</div>
                        <div class="weather-location">📍 <span id="w-addr">실시간 동기화 완료</span></div>
                    </div>
                    <div class="weather-art-icon" id="w-icon">☀️</div>
                </div>
                <div class="weather-detail-grid">
                    <div class="wd-item"><span class="wd-label">💧 습도</span><span class="wd-val" id="w-humidity">--%</span></div>
                    <div class="wd-item"><span class="wd-label">💨 바람</span><span class="wd-val" id="w-wind">-- m/s</span></div>
                    <div class="wd-item"><span class="wd-label">☔ 비 확률</span><span class="wd-val" id="w-rain">--%</span></div>
                    <div class="wd-item"><span class="wd-label">☀️ 자외선</span><span class="wd-val" id="w-uv">--</span></div>
                    <div class="wd-item"><span class="wd-label">😷 미세먼지</span><span class="wd-val" id="w-dust">--</span></div>
                </div>
            </div>

            <!-- 점수 보드 -->
            <div class="score-card" id="score-block">
                <div class="score-circle-container" id="lbl-score">0</div>
                <div class="score-info">
                    <div class="score-title">🎯 오늘의 AI 신체·환경 러닝 점수</div>
                    <div class="score-desc" id="lbl-comment">데이터 대기 중</div>
                </div>
            </div>

            <div class="input-card">
                <div class="section-title">🏃 정보 입력 & 신체·환경 통합분석</div>
                <div class="form-grid">
                    <div class="input-group"><label for="height">신장 (cm)</label><input type="number" id="height" value="175"></div>
                    <div class="input-group"><label for="weight">체중 (kg)</label><input type="number" id="weight" value="65"></div>
                    <div class="input-group">
                        <label for="experience">러닝 숙련도</label>
                        <select id="experience">
                            <option value="beginner">초급자 (런린이)</option>
                            <option value="intermediate" selected>중급자 (일반 러너)</option>
                            <option value="advanced">상급자 (마라토너)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="condition">현재 컨디션</label>
                        <select id="condition">
                            <option value="good" selected>좋음 (에너지 넘침)</option>
                            <option value="normal">보통 (무난함)</option>
                            <option value="tired">피곤함</option>
                        </select>
                    </div>
                </div>
                <button class="btn-submit" id="btn-analyze">AI 맞춤 코칭 가이드 받기</button>
                <div id="location-status" class="location-badge">📍 위치 탐색 중...</div>
            </div>

            <div id="loader" class="loader">⚡ gemini-3.1-flash-lite 분석 엔진 가동 중...</div>

            <div class="output-grid" id="result-section" style="display: none;">
                <div class="map-card">
                    <div class="section-title">🗺️ AI 추천 우회 러닝 맵 (OSRM 도로망 연동)</div>
                    <div id="map"></div>
                </div>
                <div class="output-panel">
                    <div class="section-title">⏱️ 신체 맞춤 구간 타임라인</div>
                    <div class="timeline" id="timeline-container"></div>
                </div>
                <div class="output-panel">
                    <div class="section-title">📋 AI 코칭 레포트</div>
                    <div class="description-text" id="description-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet 지도 라이브러리 선행 로드 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 💡 모든 자바스크립트 로직을 하나의 module 스코프로 통합하여 상호 충돌을 원천 방지합니다. -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 설정 고정
        const firebaseConfig = {
            apiKey: "AIzaSyCC81Sd9qJjana1VK1qPg99mTijSp5_3ZQ",
            authDomain: "erica-ac4d1.firebaseapp.com",
            projectId: "erica-ac4d1",
            storageBucket: "erica-ac4d1.firebasestorage.app",
            messagingSenderId: "186480549738",
            appId: "1:186480549738:web:f925a9910e9e23c7dc8f13"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // [기존 위치/지도 관련 전역 변수]
        let userLocation = { lat: 37.5665, lon: 126.9780 }; 
        let map = null, routeLayer = null, startMarker = null, watchId = null;

        // [게시판 관련 DOM 매핑] - 기존 아이디명에 맞게 유지
        const boardInput = document.getElementById('board-input');         
        const submitBtn = document.getElementById('btn-board-submit');     
        const boardListContainer = document.getElementById('board-list-container'); 

        // 윈도우 로드 시 전체 초기화 프로세스 작동
        window.addEventListener('DOMContentLoaded', () => {
            // 스플래시 화면 제어
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('main-app').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('main-app').style.opacity = '1';
                }, 800);
            }, 2500);

            startTracking(); // 실시간 위치 엔진 가동
            loadPosts();     // Firestore 게시글 가져오기
        });

        // 1. 실시간 위치 추적 트래킹 기능
        function startTracking() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const newLat = Number(position.coords.latitude);
                        const newLon = Number(position.coords.longitude);
                        const isMoved = Math.abs(userLocation.lat - newLat) > 0.0001 || Math.abs(userLocation.lon - newLon) > 0.0001;
                        
                        userLocation.lat = newLat;
                        userLocation.lon = newLon;
                        
                        document.getElementById('location-status').innerText = `📡 실시간 GPS 매핑 중 (${userLocation.lat.toFixed(4)}, ${userLocation.lon.toFixed(4)})`;
                        document.getElementById('location-status').style.backgroundColor = '#e3fbe3';
                        document.getElementById('location-status').style.color = '#1b5e20';

                        if (map && startMarker) startMarker.setLatLng([userLocation.lat, userLocation.lon]);
                        if (document.getElementById('result-section').style.display === 'grid' && isMoved) triggerAnalysis(true);
                    },
                    (error) => { 
                        document.getElementById('location-status').innerText = `⚠️ GPS 권한 차단됨 (기본 위치 작동)`; 
                        document.getElementById('location-status').style.backgroundColor = '#ffebe9';
                        document.getElementById('location-status').style.color = '#ff3b30';
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        // 2. AI 분석 리포트 및 기상 엔진 연동 함수
        async function triggerAnalysis(isSilent = false) {
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;
            const experience = document.getElementById('experience').value;
            const condition = document.getElementById('condition').value;
            
            if (!isSilent) {
                document.getElementById('loader').style.display = 'block';
                document.getElementById('result-section').style.display = 'none';
            }

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ height: Number(height), weight: Number(weight), experience, condition, location: userLocation })
                });
                const data = await response.json();
                if (data.error) return;

                document.getElementById('w-temp').innerText = data.weatherReal.temp;
                document.getElementById('w-status').innerText = data.weatherReal.condition;
                document.getElementById('w-humidity').innerText = data.weatherReal.humidity;
                document.getElementById('w-wind').innerText = data.weatherReal.wind;
                document.getElementById('w-rain').innerText = data.weatherReal.rainProb;
                document.getElementById('w-uv').innerText = data.weatherExtra.uv;
                document.getElementById('w-dust').innerText = data.weatherExtra.dust;
                document.getElementById('weather-widget').style.display = 'block';

                document.getElementById('lbl-score').innerText = data.runningScore;
                document.getElementById('lbl-comment').innerText = data.scoreComment;
                document.getElementById('score-block').style.display = 'flex';

                document.getElementById('running-time').innerText = data.metrics.time;
                document.getElementById('running-distance').innerText = data.metrics.distance;

                const container = document.getElementById('timeline-container');
                container.innerHTML = '';
                data.timeline.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `timeline-item ${item.isAlert ? 'alert' : ''}`;
                    let alertHtml = item.isAlert ? `<div class="timeline-alert-text">⚠️ ${item.alertText}</div>` : '';
                    div.innerHTML = `<div class="timeline-time">${item.time}</div><div class="timeline-content">${item.content}</div>${alertHtml}`;
                    container.appendChild(div);
                });

                document.getElementById('description-container').innerHTML = data.descriptionMarkdown;
                document.getElementById('loader').style.display = 'none';
                document.getElementById('result-section').style.display = 'grid';

                setTimeout(() => {
                    if (!map) {
                        map = L.map('map').setView([userLocation.lat, userLocation.lon], 15);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                    }
                    if (!startMarker) {
                        startMarker = L.marker([userLocation.lat, userLocation.lon]).addTo(map).bindPopup('🏃 내 실시간 위치').openPopup();
                    } else {
                        startMarker.setLatLng([userLocation.lat, userLocation.lon]);
                    }
                    if (data.routeCoordinates) {
                        if (routeLayer) map.removeLayer(routeLayer);
                        routeLayer = L.polyline(data.routeCoordinates, { color: '#4364F7', weight: 5, dashArray: '2, 8' }).addTo(map);
                        if(!isSilent) map.fitBounds(routeLayer.getBounds());
                    }
                }, 200);
            } catch (err) { document.getElementById('loader').style.display = 'none'; }
        }

        // 분석 버튼 이벤트 바인딩
        document.getElementById('btn-analyze').addEventListener('click', () => triggerAnalysis(false));


        // 3. Firestore 의견 게시판 연동 함수 (최신순 로드)
        async function loadPosts() {
            if (!boardListContainer) return;
            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                boardListContainer.innerHTML = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const postElement = document.createElement('div');
                    postElement.className = 'existing-post-item-class'; // 💡 기존 CSS 명칭 유지
                    
                    postElement.innerHTML = `
                        <div class="post-content">${escapeHtml(data.content)}</div>
                        <div class="post-date" style="font-size: 0.8rem; opacity: 0.5; margin-top: 5px;">
                            ${data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString('ko-KR') : '방금 전'}
                        </div>
                    `;
                    boardListContainer.appendChild(postElement);
                });
            } catch (error) {
                console.error("게시판 불러오기 실패:", error);
            }
        }

        // 4. 게시판 등록 버튼 이벤트 바인딩
        if (submitBtn) {
            submitBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                const contentText = boardInput.value.trim();
                if (!contentText) {
                    alert("내용을 입력해 주세요.");
                    return;
                }

                try {
                    submitBtn.disabled = true;
                    await addDoc(collection(db, "posts"), {
                        content: contentText,
                        createdAt: serverTimestamp() 
                    });
                    boardInput.value = "";
                    await loadPosts();
                } catch (error) {
                    console.error("Firestore 저장 실패:", error);
                    alert("글 등록 중 통신 오류가 발생했습니다.");
                } finally {
                    submitBtn.disabled = false;
                }
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
